[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "volengine"
version = "0.3.0"
description = "Five-minute volatility forecast, market-regime classifier and spike detector for Deribit BTC and ETH perpetuals, evaluated out of sample."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thibautdqb" }]
keywords = ["volatility", "forecasting", "har", "regime", "deribit", "crypto", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "httpx>=0.27",
    "websockets>=12.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.46", "plotly>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.3",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.scripts]
volengine = "volengine.cli:main"

[project.urls]
Repository = "https://github.com/Thibautdqb/volatility-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/volengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: tests that hit external APIs (deselect with -m 'not network')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "PD", "RUF"]
ignore = ["N803", "N806", "RUF002", "RUF003", "E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["PD010"]  # unstack is the clearest way to lay out result tables
